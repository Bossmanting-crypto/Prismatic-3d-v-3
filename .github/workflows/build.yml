name: Build Windows installer

# Change this to the folder holding package.json if the project sits in a
# subdirectory of your repository (for example: prism-tauri).
env:
  PROJECT_DIR: .

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Cheap gate: catches JavaScript syntax errors and, more usefully, proves
  # the three.js import graph still resolves before spending Windows minutes.
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Syntax-check the renderer
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for f in app.js lens.js atmosphere.js hud-pad.js bridge.js scripts/vendor.mjs; do
            node --check "$f" && echo "ok  $f"
          done

      - name: Resolve the three.js import graph
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run vendor

  windows:
    name: Build installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The Rust dependency build is the slow part. Cached, later runs
      # drop from roughly ten minutes to under two.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR }}/src-tauri -> target

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: List what was produced
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "── bundle ──"
          ls -la src-tauri/target/release/bundle/nsis/ || true
          echo "── standalone ──"
          ls -la src-tauri/target/release/*.exe || true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: prism-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/prism.exe

      # Pushing a tag like v1.0.0 publishes a Release with the installer attached.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
